
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171323">
  <title>سِراج | SIRAJ</title>
  <style>
    :root {
      --bg: #100e18;
      --panel: #1b1827;
      --panel2: #242033;
      --gold: #e7c77c;
      --text: #f7f3ff;
      --muted: #aaa3bd;
      --line: #373047;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100dvh; display: flex; }
    aside {
      width: 270px;
      flex-shrink: 0;
      background: var(--panel);
      border-left: 1px solid var(--line);
      padding: 22px 16px;
    }
    .brand { font-size: 27px; font-weight: 800; color: var(--gold); }
    .tagline { font-size: 12px; color: var(--muted); margin: 5px 0 26px; }
    .section-title { color: var(--muted); font-size: 13px; margin: 20px 8px 10px; }
    #rooms { display: grid; gap: 8px; }
    .room {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--text);
      background: transparent;
      text-align: right;
    }
    .room.active { background: var(--panel2); border-color: #514263; }
    .room-icon { font-size: 23px; }
    .room-name { flex: 1; font-weight: 650; }
    .room small { color: var(--muted); display: block; font-weight: 400; margin-top: 3px; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100dvh; }
    header {
      padding: 17px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: #151220;
    }
    .room-heading { flex: 1; min-width: 0; }
    h1 { font-size: 19px; margin: 0; }
    .status { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .profile {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--gold);
      border-radius: 10px;
      padding: 9px 12px;
      max-width: 45%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .welcome {
      margin: auto;
      max-width: 340px;
      text-align: center;
      color: var(--muted);
      line-height: 1.9;
    }
    .welcome .lamp { font-size: 42px; }
    .welcome strong { color: var(--gold); font-size: 22px; }
    .message {
      max-width: min(80%, 570px);
      padding: 11px 14px;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 15px 15px 4px 15px;
      align-self: flex-start;
      overflow-wrap: anywhere;
    }
    .message.mine {
      align-self: flex-end;
      background: #332744;
      border-color: #5a426a;
      border-radius: 15px 15px 4px 15px;
    }
    .sender { font-size: 12px; color: var(--gold); margin-bottom: 5px; }
    .message-text { white-space: pre-wrap; line-height: 1.65; }
    .composer-wrap { padding: 14px 18px; border-top: 1px solid var(--line); }
    #composer { display: flex; gap: 10px; max-width: 950px; margin: auto; }
    #messageInput {
      min-width: 0; flex: 1; border: 1px solid var(--line);
      border-radius: 13px; background: var(--panel); color: var(--text);
      padding: 13px 15px; outline: none;
    }
    #messageInput:focus { border-color: var(--gold); }
    #sendButton, .primary {
      border: 0; border-radius: 12px; padding: 12px 18px;
      background: var(--gold); color: #211a2b; font-weight: 750;
    }
    button:disabled { opacity: .5; cursor: wait; }
    #notice { min-height: 20px; font-size: 12px; color: var(--muted); padding: 5px 3px 0; }
    .overlay {
      position: fixed; inset: 0; z-index: 5;
      background: rgba(12,10,19,.94);
      display: grid; place-items: center; padding: 20px;
    }
    .login-card {
      width: min(100%, 390px); background: var(--panel);
      border: 1px solid var(--line); border-radius: 22px;
      padding: 27px; text-align: center;
    }
    .login-card .brand { font-size: 32px; }
    .login-card p { color: var(--muted); line-height: 1.8; }
    #nickname {
      width: 100%; padding: 13px; margin: 12px 0;
      background: var(--bg); border: 1px solid var(--line);
      color: white; border-radius: 11px;
    }
    .login-card .primary { width: 100%; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) {
      .app { flex-direction: column; }
      aside { width: 100%; padding: 14px 13px 10px; border-left: 0; border-bottom: 1px solid var(--line); }
      .brand { font-size: 23px; }
      .tagline { margin: 2px 0 12px; }
      .section-title { margin: 10px 5px 8px; }
      #rooms { display: flex; overflow-x: auto; padding-bottom: 5px; }
      .room { width: auto; min-width: 145px; padding: 9px; }
      .main { height: auto; min-height: 55dvh; flex: 1; }
      #messages { min-height: 250px; padding: 16px 12px; }
      header { padding: 13px; }
      .composer-wrap { padding: 10px; }
      #sendButton { padding: 11px 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">سِراج ✦</div>
      <div class="tagline">مساحتك، حكايتك، وعالمك.</div>
      <div class="section-title">غرف سِراج</div>
      <div id="rooms">
        <div class="status">جاري تحميل الغرف...</div>
      </div>
    </aside>

    <main class="main">
      <header>
        <div class="room-heading">
          <h1 id="roomTitle">أهلًا بك في سِراج</h1>
          <div class="status" id="roomDescription">مساحتك للسوالف والوناسة</div>
        </div>
        <button class="profile" id="profileButton">ضيف</button>
      </header>

      <div id="messages" aria-live="polite">
        <div class="welcome">
          <div class="lamp">✦</div>
          <strong>مرحبًا بك في سِراج</strong>
          <div>اختر غرفة وابدأ السوالف مع الموجودين فيها.</div>
        </div>
      </div>

      <div class="composer-wrap">
        <form id="composer">
          <input id="messageInput" maxlength="1000"
            placeholder="اكتب رسالتك هنا..." autocomplete="off" disabled>
          <button id="sendButton" type="submit" disabled>إرسال</button>
        </form>
        <div id="notice" role="status">جاري الاتصال...</div>
      </div>
    </main>
  </div>

  <div class="overlay" id="loginLayer">
    <form class="login-card" id="loginForm">
      <div class="brand">سِراج ✦</div>
      <p>أهلًا بك في مساحتك للسوالف والوناسة.<br>اختر اسمًا مستعارًا للدخول.</p>
      <input id="nickname" maxlength="24" required
        placeholder="اكتب اسمك المستعار" autocomplete="nickname">
      <button class="primary" type="submit">دخول الشات</button>
      <div class="status" id="loginStatus"></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth, signInAnonymously, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, collection, doc, addDoc, onSnapshot,
      query, where, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDQUWD0Rq3QkMRvZ0NwbkM9ifKG8hH7tTA",
      authDomain: "siraj-7c46f.firebaseapp.com",
      projectId: "siraj-7c46f",
      storageBucket: "siraj-7c46f.firebasestorage.app",
      messagingSenderId: "959478086475",
      appId: "1:959478086475:web:7a1f1d6467e991213c06ce"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);
    let nickname = "";
    let currentRoom = null;
    let stopMessages = null;
    let stopRooms = null;
    let sending = false;

    const roomsEl = $("rooms");
    const messagesEl = $("messages");

    function setNotice(message) {
      $("notice").textContent = message;
    }

    function showWelcome(message) {
      messagesEl.replaceChildren();
      const box = document.createElement("div");
      box.className = "welcome";
      const lamp = document.createElement("div");
      lamp.className = "lamp";
      lamp.textContent = "✦";
      const title = document.createElement("strong");
      title.textContent = "سِراج";
      const description = document.createElement("div");
      description.textContent = message;
      box.append(lamp, title, description);
      messagesEl.append(box);
    }

    function renderMessages(snapshot) {
      const docs = snapshot.docs.slice().sort((a, b) => {
        const at = a.data().createdAt?.toMillis?.() ?? 0;
        const bt = b.data().createdAt?.toMillis?.() ?? 0;
        return at - bt;
      });

      messagesEl.replaceChildren();

      if (!docs.length) {
        showWelcome("كن أول من يبدأ السوالف في هذه الغرفة 💜");
        return;
      }

      for (const item of docs) {
        const data = item.data();
        const bubble = document.createElement("div");
        bubble.className = "message" +
          (data.sender === nickname ? " mine" : "");

        const sender = document.createElement("div");
        sender.className = "sender";
        sender.textContent = data.sender || "ضيف";

        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = data.text || "";

        bubble.append(sender, text);
        messagesEl.append(bubble);
      }

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function selectRoom(room) {
      currentRoom = room;

      document.querySelectorAll(".room").forEach(button => {
        button.classList.toggle("active", button.dataset.id === room.id);
      });

      $("roomTitle").textContent = room.name || "غرفة";
      $("roomDescription").textContent =
        room.description || "مرحبًا بك في الغرفة";

      if (stopMessages) stopMessages();
      showWelcome("جاري تحميل الرسائل...");

      const roomMessages = query(
        collection(db, "messages"),
        where("roomId", "==", room.id)
      );

      stopMessages = onSnapshot(roomMessages, renderMessages, error => {
        console.error(error);
        setNotice("تعذر تحميل الرسائل. تحقق من قواعد Firestore.");
      });

      $("messageInput").disabled = false;
      $("sendButton").disabled = false;
      setNotice("أنت الآن في " + (room.name || "الغرفة"));
    }

    function renderRooms(snapshot) {
      const rooms = snapshot.docs.map(item => ({
        id: item.id,
        ...item.data()
      })).sort((a, b) => (a.order ?? 999) - (b.order ?? 999));

      roomsEl.replaceChildren();

      if (!rooms.length) {
        const empty = document.createElement("div");
        empty.className = "status";
        empty.textContent = "لا توجد غرف بعد.";
        roomsEl.append(empty);
        setNotice("لم نعثر على غرف في مجموعة rooms.");
        return;
      }

      for (const room of rooms) {
        const button = document.createElement("button");
        button.className = "room";
        button.dataset.id = room.id;

        const icon = document.createElement("span");
        icon.className = "room-icon";
        icon.textContent = room.icon || "💬";

        const details = document.createElement("span");
        details.className = "room-name";
        details.append(document.createTextNode(room.name || room.id));

        const description = document.createElement("small");
        description.textContent = room.description || "غرفة دردشة";
        details.append(description);

        button.append(icon, details);
        button.addEventListener("click", () => selectRoom(room));
        roomsEl.append(button);
      }

      const chosen = rooms.find(room => room.id === currentRoom?.id) || rooms[0];
      selectRoom(chosen);
      setNotice("تم الاتصال بسِراج");
    }

    $("loginForm").addEventListener("submit", event => {
      event.preventDefault();
      const value = $("nickname").value.trim();

      if (!value) return;
      nickname = value.slice(0, 24);
      $("profileButton").textContent = nickname;
      $("loginLayer").hidden = true;
      sessionStorage.setItem("sirajNickname", nickname);
    });

    $("profileButton").addEventListener("click", () => {
      $("nickname").value = nickname;
      $("loginLayer").hidden = false;
    });

    $("composer").addEventListener("submit", async event => {
      event.preventDefault();
      const text = $("messageInput").value.trim();

      if (!text || !currentRoom || sending) return;

      sending = true;
      $("sendButton").disabled = true;

      try {
        await addDoc(collection(db, "messages"), {
          sender: nickname,
          text,
          roomId: currentRoom.id,
          createdAt: serverTimestamp()
        });

        $("messageInput").value = "";
        setNotice("تم إرسال رسالتك");
      } catch (error) {
        console.error(error);
        setNotice("لم تُرسل الرسالة. تأكد من قواعد Firestore.");
      } finally {
        sending = false;
        $("sendButton").disabled = false;
      }
    });

    try {
      const savedNickname = sessionStorage.getItem("sirajNickname");
      if (savedNickname) {
        nickname = savedNickname;
        $("nickname").value = savedNickname;
        $("profileButton").textContent = savedNickname;
        $("loginLayer").hidden = true;
      }

      await signInAnonymously(auth);

      onAuthStateChanged(auth, user => {
        if (!user) return;
        if (stopRooms) stopRooms();

        stopRooms = onSnapshot(
          collection(db, "rooms"),
          renderRooms,
          error => {
            console.error(error);
            roomsEl.textContent = "تعذر تحميل الغرف.";
            setNotice("تحقق من قواعد Firestore وصلاحيات القراءة.");
          }
        );
      });
    } catch (error) {
      console.error(error);
      setNotice("تعذر الاتصال. تحقق من إعدادات Firebase.");
      $("loginStatus").textContent =
        "تعذر الاتصال. تأكد أن الدخول المجهول مفعّل في Firebase Authentication.";
    }
  </script>
</body>
</html>
