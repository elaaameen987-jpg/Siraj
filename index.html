<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سِراج - الشات العربي الفخم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: #160e26;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 100%;
            max-height: 88vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #d4af37;
            position: relative;
        }
        
        /* الهيدر العلوي */
        .chat-header {
            background: linear-gradient(135deg, #2c1b4d, #3f276b);
            color: #d4af37;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d4af37;
        }
        .chat-header h2 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-badge {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        
        /* محتوى الشات */
        .chat-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .chat-messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #faf8fc;
        }
        
        .message-card {
            background: #ffffff;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #e6dff2;
            max-width: 75%;
            box-shadow: 0 2px 5px rgba(44, 27, 77, 0.04);
        }
        .message-card .username {
            font-weight: 700;
            color: #5c3596;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .message-card .text {
            color: #2d2640;
            font-size: 15px;
            line-height: 1.5;
        }

        /* قائمة المتواجدين الجانبية */
        .online-sidebar {
            width: 210px;
            background: #f4f0fa;
            border-right: 1px solid #e6dff2;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .online-sidebar h4 {
            font-size: 14px;
            color: #5c3596;
            margin-bottom: 12px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 5px;
            font-weight: 700;
        }
        .online-user {
            font-size: 14px;
            color: #3b2d54;
            padding: 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #2ed573;
            border-radius: 50%;
        }

        /* خانة إرسال الرسائل */
        .chat-input-area {
            padding: 15px;
            background: #ffffff;
            border-top: 1px solid #e6dff2;
            display: flex;
            gap: 12px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            background: #fbf9fc;
            border: 1px solid #d4c7ed;
            color: #2d2640;
            border-radius: 8px;
